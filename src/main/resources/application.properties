# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/studentstorefront
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:CHANGE_THIS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:YTM0NTY3ODlhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ejEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6}
jwt.expiration=86400000

# ===============================
# EMAIL CONFIGURATION
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dev-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# APP CONFIGURATION
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# WHATSAPP BOT CONFIGURATION
# ===============================
whatsapp.bot.phone=${WHATSAPP_BOT_PHONE:15551234567}
whatsapp.bot.api-key=${BOT_API_KEY:changeme-set-this-in-env}

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:changeme}
cloudinary.api-key=${CLOUDINARY_API_KEY:changeme}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:changeme}

# ===============================
# MULTIPART UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB