# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/studentstorefront
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.user=${FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ===============================
# EMAIL CONFIGURATION
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dev-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# APP CONFIGURATION
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# WHATSAPP BOT CONFIGURATION
# ===============================
whatsapp.bot.phone=${WHATSAPP_BOT_PHONE:15551234567}
whatsapp.bot.api-key=${BOT_API_KEY:}
whatsapp.bot.api-url=${WHATSAPP_BOT_API_URL:http://127.0.0.1:3001}

# Set to true (or use the prod/production profile) to fail startup if secrets are missing.
app.require-secure-secrets=${REQUIRE_SECURE_SECRETS:false}

# Scheduled jobs (outbox delivery, expiry, cleanup) get their own threads so a
# slow bot call can't hold up archival and reminders.
spring.task.scheduling.pool.size=4

# Only proxy addresses listed here may supply X-Forwarded-For to the limiter.
app.trusted-proxy-addresses=${TRUSTED_PROXY_ADDRESSES:}

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# MULTIPART UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
