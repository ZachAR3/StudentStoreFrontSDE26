services:
  db:
    image: postgres:15.13
    environment:
      POSTGRES_DB: studentstorefront
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_MIGRATION_USER: ${FLYWAY_USERNAME:?Set FLYWAY_USERNAME in .env}
      POSTGRES_MIGRATION_PASSWORD: ${FLYWAY_PASSWORD:?Set FLYWAY_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PGDATA lives in /var/lib/postgresql/data. Mounting the parent left the
      # data in an anonymous volume that `down`/`up` could lose (DB-09).
      # Existing deployments: pg_dump before switching, restore after.
      - db_persistency:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro

volumes:
  db_persistency:
